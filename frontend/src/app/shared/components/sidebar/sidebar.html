<aside class="fs-sidebar">
  <a routerLink="/home" class="fs-brand" aria-label="Voltar para Visão geral">
    <img src="logoFinanSysBranco.png" alt="FinanSys — Sistema Contábil">
  </a>
  <nav class="fs-nav" aria-labelledby="fs-nav-title">
    <p id="fs-nav-title" class="fs-nav-label">Área de trabalho</p>
    @for (item of itens; track item.nome) {
      @if (item.rota) {
        <a class="fs-nav-item" [routerLink]="item.rota" routerLinkActive="fs-active" ariaCurrentWhenActive="page">
          <span class="fs-nav-icon" aria-hidden="true">{{ item.icone }}</span><span>{{ item.nome }}</span>
        </a>
      } @else {
        <span class="fs-nav-item fs-nav-pendente" role="link" aria-disabled="true" [attr.title]="item.nome + ' — indisponível'">
          <span class="fs-nav-icon" aria-hidden="true">{{ item.icone }}</span><span>{{ item.nome }} <small>Indisponível</small></span>
        </span>
      }
    }
  </nav>
</aside>
