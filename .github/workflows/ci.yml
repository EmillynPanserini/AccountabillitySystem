name: Fundação

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Build e testes Java
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: microsoft
          java-version: '21'
      - name: Executar build e testes
        run: bash ./mvnw -B -ntp clean verify
      - name: Conferir o JAR
        run: test -s target/accountabilitySystem-1.0-SNAPSHOT.jar

  angular:
    name: Build e testes Angular
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - name: Validar a versão do npm
        run: test "$(npm --version)" = "11.20.0"
      - name: Instalar dependências
        run: npm ci --engine-strict
      - name: Executar testes
        run: npm run test:ci
      - name: Compilar para produção
        run: npm run build
      - name: Conferir a saída Angular
        run: test -s dist/accountability/browser/index.html

  gate-entrega:
    name: Gate de entrega
    runs-on: ubuntu-24.04
    needs: [java, angular]
    if: ${{ success() }}
    steps:
      - name: Confirmar os builds e testes
        run: echo 'Builds e testes Java e Angular concluídos.'
